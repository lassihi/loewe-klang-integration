# The action SHAs are the v7.0.1 (checkout) and v7.1.0 (setup-python) tags.
# Forgejo and Gitea also read this directory.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest tested Home Assistant (hacs.json allows 2026.2.0) and a current one.
          - python: "3.13"
            homeassistant: "2026.2.3"
            pytest_ha: "0.13.316"
          - python: "3.14"
            homeassistant: "2026.10.4"
            pytest_ha: "0.13.375"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: >-
          python -m pip install
          "homeassistant==${{ matrix.homeassistant }}"
          "pytest-homeassistant-custom-component==${{ matrix.pytest_ha }}"
          "pychromecast==14.1.0"
      - name: Run tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.3"
      - name: Run ruff
        run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      # Audits what the manifest makes Home Assistant install. Home Assistant's
      # own dependencies are its project's to fix, and would fail every run.
      - name: Audit the integration's requirements
        run: |
          python -c 'import json; print(*json.load(open("custom_components/loewe_klang/manifest.json"))["requirements"], sep="\n")' > "$RUNNER_TEMP/requirements.txt"
          pip-audit --requirement "$RUNNER_TEMP/requirements.txt"
